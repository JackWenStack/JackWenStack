name: Generate Snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JackWenStack
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#526c22&color_dots=#ebeee7,#c9dda9,#a4c96a,#7ba637,#526c22
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d5ff70&color_dots=#222b20,#435c2b,#6d943e,#a4cf55,#d5ff70

      - name: Build contribution signal
        run: |
          python3 scripts/render-contributions.py \
            dist/github-contribution-grid-snake.svg \
            dist/contribution-signal.svg \
            --mobile-output dist/contribution-signal-mobile.svg

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
