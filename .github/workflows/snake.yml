name: Generate Contribution Signal

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution source
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JackWenStack
          outputs: |
            build/contribution-source.svg

      - name: Build contribution signal
        run: |
          python3 scripts/render-contributions.py \
            build/contribution-source.svg \
            dist/contribution-signal.svg \
            --mobile-output dist/contribution-signal-mobile.svg

      - name: Publish contribution signal
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
