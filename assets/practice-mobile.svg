<svg xmlns="http://www.w3.org/2000/svg" width="640" height="644" viewBox="0 0 640 644" fill="none" role="img" aria-labelledby="title desc"><title id="title">Build systems. Craft interfaces. Ship software.</title><desc id="desc">Backend: Java, Spring Boot, MySQL, Redis, Maven. Frontend: Vue, TypeScript, JavaScript, Vite, HTML and CSS. Delivery: Docker, Linux, Nginx and Git.</desc><rect width="640" height="644" rx="4" fill="#edf1f6"/><text x="32" y="78" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">BUILD.</text><text x="34" y="128" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="0">Java · Spring Boot</text><text x="34" y="174" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="0">MySQL · Redis · Maven</text><path d="M32 204H608" stroke="#cad3df"/><text x="32" y="286" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">CRAFT.</text><text x="34" y="336" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="0">Vue · TypeScript</text><text x="34" y="382" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="0">JavaScript · Vite · HTML / CSS</text><path d="M32 412H608" stroke="#cad3df"/><text x="32" y="494" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">SHIP.</text><text x="34" y="544" fill="#171e2b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" letter-spacing="0">Docker · Linux</text><text x="34" y="590" fill="#536174" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" letter-spacing="0">Nginx · Git</text></svg>
